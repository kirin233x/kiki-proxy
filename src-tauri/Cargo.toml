[workspace]
members = [".", "core"]

[package]
name = "kiki-proxy"
version = "0.1.0"
description = "kiki-proxy - 本地 AI 网关"
authors = ["kirin233x"]
edition = "2021"

[lib]
name = "kiki_proxy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kiki-core = { path = "core" }
anyhow = "1"
keyring = { version = "3", features = ["apple-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }


[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
