[package]
name = "kiki-core"
version = "0.1.0"
edition = "2021"
description = "kiki-proxy 网关引擎：协议转换、路由、出口代理、插件、日志"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
futures = "0.3"
parking_lot = "0.12"
reqwest = { version = "0.12", features = ["json", "stream", "socks"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
